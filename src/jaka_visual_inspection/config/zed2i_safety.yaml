# ZED 2i body tracking override for safety zone detection
# Passed as ros_params_override_path to the ZED wrapper
---
/**:
  ros__parameters:
    pos_tracking:
      pos_tracking_enabled: true
      publish_tf: true
      publish_map_tf: true
      map_frame: 'world'
      initial_base_pose: [0.90, 0.90, 1.50, 0.0, -1.047, -2.356]
      
    body_tracking:
      bt_enabled: true
      model: 'HUMAN_BODY_FAST'
      body_format: 'BODY_18'
      allow_reduced_precision: true
      max_range: 5.0
      detection_confidence: 40
      enable_tracking: true
      enable_body_fitting: false
